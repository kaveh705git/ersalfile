<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ارسال فایل</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Tahoma, sans-serif; background: #f0f4ff; display: flex; justify-content: center; padding: 20px; }
    .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { text-align: center; color: #333; }
    .file-box { border: 2px dashed #aaa; padding: 30px; text-align: center; border-radius: 8px; position: relative; margin-bottom: 15px; cursor: pointer; }
    .file-box input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #555; }
    .input-group input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    button:disabled { background: #ccc; }
    #status { text-align: center; margin-top: 15px; font-size: 14px; display: none; padding: 10px; border-radius: 5px; }
    .success { background: #e6f9ed; color: #1a7f37; }
    .error { background: #ffecec; color: #c0392b; }
  </style>
</head>
<body>

<div class="container">
  <h2>ارسال فایل</h2>

  <form id="uploadForm">
    <div class="file-box">
      <p>برای انتخاب فایل کلیک کنید</p>
      <input type="file" id="fileInput" />
    </div>

    <div id="fileInfo" style="display: none; background: #f9f9f9; padding: 10px; margin-bottom: 15px; border-radius: 5px; font-size: 14px;">
      فایل انتخاب شده: <span id="fileNameText"></span>
    </div>

    <div class="input-group">
      <label>نام شما</label>
      <input type="text" id="customerName" placeholder="نام خود را وارد کنید" required />
    </div>

    <div class="input-group">
      <label>شماره تماس</label>
      <input type="text" id="customerPhone" placeholder="شماره تماس" required />
    </div>

    <button type="submit" id="submitBtn" disabled>ارسال فایل</button>
  </form>

  <div id="status"></div>
</div>

<script>
  // ═══════════════════════════════════════════════
  // 🔴 فقط این دو خط را تغییر دهید
  // ═══════════════════════════════════════════════
  const SUPABASE_URL = 'https://bzkzcyqvnuckbqulhjhp.supabase.co/rest/v1'; 
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6a3pjeXF2bnVja2JxdWxoamhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MTU1ODgsImV4cCI6MjEwOTE5MTU4OH0.RTOpuuJOiPbp5f-PXmn42ARVkxQH0PtMA8YyAc4PGTI'; 
  
  const BUCKET_NAME = 'customer-uploads';

  // راه‌اندازی Supabase
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // المان‌ها
  const fileInput = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const fileNameText = document.getElementById('fileNameText');
  const submitBtn = document.getElementById('submitBtn');
  const uploadForm = document.getElementById('uploadForm');
  const statusDiv = document.getElementById('status');
  
  let selectedFile = null;

  // ۱. انتخاب فایل
  fileInput.addEventListener('change', function() {
    if (this.files && this.files.length > 0) {
      selectedFile = this.files[0];
      fileNameText.textContent = selectedFile.name;
      fileInfo.style.display = 'block';
      submitBtn.disabled = false;
      statusDiv.style.display = 'none';
    }
  });

  // ۲. ارسال
  uploadForm.addEventListener('submit', async function(e) {
    e.preventDefault(); // جلوگیری از رفرش صفحه

    if (!selectedFile) return;

    const name = document.getElementById('customerName').value;
    const phone = document.getElementById('customerPhone').value;

    if (!name || !phone) {
      showStatus('لطفاً نام و شماره را وارد کنید.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'در حال ارسال...';
    statusDiv.style.display = 'none';

    try {
      // 🔥 این مهم‌ترین بخش است: نام فایل را به سادگی هر چه تمام‌تر می‌سازیم
      // فقط یک عدد + پسوند. هیچ فاصله یا کاراکتر عجیبی در آن نیست.
      const fileExt = selectedFile.name.split('.').pop(); 
      const safeName = 'file_' + Date.now() + '.' + fileExt;

      // آپلود
      const { data, error } = await supabaseClient.storage
        .from(BUCKET_NAME)
        .upload(safeName, selectedFile);

      if (error) throw error;

      showStatus('فایل با موفقیت ارسال شد ✅', 'success');
      uploadForm.reset();
      fileInfo.style.display = 'none';
      selectedFile = null;

    } catch (err) {
      console.error(err);
      showStatus('خطا در ارسال: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'ارسال فایل';
    }
  });

  function showStatus(msg, type) {
    statusDiv.textContent = msg;
    statusDiv.className = type;
    statusDiv.style.display = 'block';
  }
</script>

</body>
</html>
