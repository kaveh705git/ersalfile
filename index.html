<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ارسال فایل | کافی‌نت</title>
  <!-- اضافه کردن defer برای اطمینان از لود شدن قبل از اجرای اسکریپت -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', 'Segoe UI', sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
    .container { background: #fff; border-radius: 16px; padding: 32px; max-width: 480px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    h1 { text-align: center; color: #333; font-size: 1.5rem; }
    .subtitle { text-align: center; color: #777; font-size: 0.9rem; margin: 8px 0 24px; }
    .drop-zone { border: 2px dashed #c3c3c3; border-radius: 12px; padding: 32px 16px; text-align: center; cursor: pointer; transition: all 0.2s; color: #666; }
    .drop-zone:hover, .drop-zone.dragover { border-color: #667eea; background: #f5f6ff; }
    .drop-zone__icon { font-size: 2.5rem; display: block; margin-bottom: 8px; }
    .file-info { display: flex; align-items: center; justify-content: space-between; background: #f0f4ff; border-radius: 10px; padding: 12px 16px; margin-top: 12px; }
    .file-details { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: #333; word-break: break-all; }
    #fileSize { color: #777; font-size: 0.75rem; }
    .btn-remove { background: #ff4d4f; color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; flex-shrink: 0; }
    .field { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.85rem; color: #444; }
    .field input { padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
    .field input:focus { border-color: #667eea; }
    .btn-submit { width: 100%; margin-top: 24px; padding: 12px; background: #667eea; color: #fff; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover:not(:disabled) { background: #5568d3; }
    .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
    .status { margin-top: 20px; padding: 12px; border-radius: 10px; text-align: center; font-size: 0.9rem; }
    .status.success { background: #e6f9ed; color: #1a7f37; }
    .status.error { background: #ffecec; color: #c0392b; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ارسال فایل</h1>
    <p class="subtitle">فایل عکس، PDF یا ZIP خود را انتخاب کنید</p>

    <form id="uploadForm">
      <!-- تغییر: input از حالت hidden در نیامده تا مشکل نداشته باشیم -->
      <div id="dropZone" class="drop-zone">
        <span class="drop-zone__icon">📁</span>
        <p>فایل را اینجا بکشید یا کلیک کنید</p>
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.zip" style="display: none;" />
      </div>

      <div id="fileInfo" class="file-info hidden">
        <div class="file-details">
          <span id="fileName"></span>
          <span id="fileSize"></span>
        </div>
        <button type="button" id="removeFile" class="btn-remove">✕</button>
      </div>

      <div class="field">
        <label for="customerName">نام شما</label>
        <input type="text" id="customerName" placeholder="نام و نام خانوادگی" required />
      </div>

      <div class="field">
        <label for="customerPhone">شماره تماس</label>
        <input type="tel" id="customerPhone" placeholder="۰۹۱۲..." required />
      </div>

      <button type="submit" id="submitBtn" class="btn-submit" disabled>ارسال فایل</button>
    </form>

    <div id="statusMessage" class="status hidden"></div>
  </div>

  <!-- قرار دادن کد در انتهای بادی برای اطمینان از لود شدن کامل HTML -->
  <script>
    // ═══════════════════════════════════════════════
    // 🔴 تنظیمات Supabase
    // ═══════════════════════════════════════════════
    const SUPABASE_URL = 'https://zkxezdqgpssaaaejmhws.supabase.co/rest/v1'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpreGV6ZHFncHNzYWFhZWptaHdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MDExNDcsImV4cCI6MjEwOTE3NzE0N30.2K9_BdPgfeOoVCB9PM22Co6Oh8HNdCA3wS5V1JSp8CY
'; 
    const BUCKET_NAME = 'customer-uploads';

    // ═══════════════════════════════════════════════

    // یک هشدار برای تست اینکه آیا کد اجرا می‌شود یا خیر (بعدا می‌توانی پاکش کنی)
    console.log("جاوا اسکریپت شروع به کار کرد!");
    alert("سیستم آماده است. (این پیام فقط برای تست است)");

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const removeFileBtn = document.getElementById('removeFile');
    const form = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    let selectedFile = null;
    let supabaseClient = null;

    // اتصال به Supabase (در پس‌زمینه)
    try {
        if (SUPABASE_URL !== 'YOUR_SUPABASE_URL' && typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch (error) {
        console.error('خطا در اتصال به Supabase:', error);
    }

    // ۱. باز کردن پنجره انتخاب فایل با کلیک روی محدوده
    dropZone.addEventListener('click', function(e) {
        e.preventDefault();
        fileInput.click();
    });

    // ۲. درگ و دراپ
    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', function() {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    // ۳. انتخاب فایل از پنجره مرورگر
    fileInput.addEventListener('change', function() {
        if (fileInput.files.length) {
            handleFile(fileInput.files[0]);
        }
    });

    // تابع پردازش فایل
    function handleFile(file) {
        // بررسی حجم
        if (file.size > 20 * 1024 * 1024) {
            showStatus('حجم فایل بیش از ۲۰ مگابایت است.', 'error');
            return;
        }
        
        selectedFile = file;
        fileName.textContent = file.name;
        fileSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
        fileInfo.classList.remove('hidden');
        submitBtn.disabled = false;
        hideStatus();
    }

    // حذف فایل
    removeFileBtn.addEventListener('click', function(e) {
        e.preventDefault();
        selectedFile = null;
        fileInput.value = '';
        fileInfo.classList.add('hidden');
        submitBtn.disabled = true;
        hideStatus();
    });

    // نمایش وضعیت
    function showStatus(msg, type) {
        statusMessage.textContent = msg;
        statusMessage.className = 'status ' + type;
    }

    function hideStatus() {
        statusMessage.className = 'status hidden';
        statusMessage.textContent = '';
    }

    // ۴. ارسال به Supabase
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (!selectedFile) {
            showStatus('لطفاً ابتدا یک فایل انتخاب کنید.', 'error');
            return;
        }

        if (!supabaseClient) {
            showStatus('اتصال به سرور برقرار نیست. کلیدهای Supabase را بررسی کنید.', 'error');
            return;
        }

        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        
        if (!name || !phone) {
            showStatus('لطفاً نام و شماره تماس را وارد کنید.', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'در حال ارسال...';
        hideStatus();

        try {
            const fileExt = selectedFile.name.split('.').pop();
            const safeName = name.replace(/[^a-zA-Z0-9آ-ی]/g, '-'); 
            const uniqueFileName = Date.now() + '_' + phone + '_' + safeName + '.' + fileExt;

            const { data, error } = await supabaseClient.storage
              .from(BUCKET_NAME)
              .upload(uniqueFileName, selectedFile, {
                cacheControl: '3600',
                upsert: false
              });

            if (error) throw error;

            showStatus('فایل با موفقیت ارسال شد ✅', 'success');
            form.reset();
            selectedFile = null;
            fileInfo.classList.add('hidden');
        } catch (err) {
            console.error('خطای آپلود:', err);
            showStatus('خطا در ارسال: ' + err.message, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'ارسال فایل';
        }
    });
  </script>
</body>
</html>
